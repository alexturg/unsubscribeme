name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install locked dependencies and project
        run: |
          python -m pip install --require-hashes -r deploy/requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Test
        env:
          TELEGRAM_BOT_TOKEN: '123456:TEST_ONLY_NO_NETWORK'
        run: python -m pytest -q

  deploy:
    name: Deploy production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: unsubscribeme-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip commits superseded on main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$COMMIT" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Send tested source to restricted deployment account
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          sshdir=$(mktemp -d)
          trap 'rm -rf "$sshdir"' EXIT
          chmod 700 "$sshdir"
          printf '%s\n' "$DEPLOY_KEY" > "$sshdir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$sshdir/known_hosts"
          chmod 600 "$sshdir/key" "$sshdir/known_hosts"
          git archive --format=tar "$COMMIT" | ssh -T \
            -i "$sshdir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$sshdir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "unsubscribeme-deploy@$DEPLOY_HOST" "deploy $COMMIT"
